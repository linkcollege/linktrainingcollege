<!DOCTYPE html>
<html>
<head>
  <title>Uploads – LINK Training College</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      background-color: #fffdd0;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: blue;
    }

    .upload-container {
      background: white;
      max-width: 500px;
      margin: 30px auto;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .upload-container p {
      color: maroon;
      margin-bottom: 15px;
    }

    input[type="file"] {
      display: block;
      margin: 15px auto;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
      width: 80%;
      background-color: #fafafa;
    }

    button {
      background-color: maroon;
      color: white;
      font-weight: bold;
      padding: 10px 25px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin: 10px;
    }

    button:hover {
      background-color: darkred;
    }

    #message {
      margin-top: 15px;
      color: green;
      font-weight: bold;
    }

    footer {
      background-color: maroon;
      color: white;
      text-align: center;
      padding: 15px;
      font-size: 14px;
      margin-top: 40px;
    }

    footer a {
      color: white;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div id="navbar-placeholder"></div>
  <script>
    fetch("navbar.html")
      .then(res => res.text())
      .then(data => {
        document.getElementById("navbar-placeholder").innerHTML = data;
      });
  </script>

  <h1>📤 Admin Uploads</h1>

  <div class="upload-container">
    <p>Upload official college documents here.<br>
    <strong>Allowed file type:</strong> PDF (max 10 MB).</p>

    <form id="uploadForm" action="https://script.google.com/macros/s/AKfycbxFXNTYwfyEI-KEHtqRjCVG2DwRQlK5LaLjAAEGjPha" method="POST" enctype="multipart/form-data" target="_blank">
      <input type="file" name="file" accept="application/pdf" required>
      <br>
      <button type="submit">Upload</button>
      <button type="reset">Cancel</button>
    </form>

    <div id="message"></div>
  </div>

  <footer>
    <p>&copy; 2025 LINK Training College. All rights reserved.</p>
    <p>Email: <a href="mailto:link@lifewaymi.org">link@lifewaymi.org</a></p>
    <p>Phone: <a href="tel:+254706124127">+254 706124127</a></p>
  </footer>

  <script>
    const form = document.getElementById('uploadForm');
    const message = document.getElementById('message');

    form.addEventListener('submit', function () {
      message.textContent = 'Uploading... Please wait.';
      setTimeout(() => {
        message.textContent = '✅ Upload successful! Your file has been sent.';
      }, 2500);
    });

    form.addEventListener('reset', function () {
      message.textContent = '';
    });
  </script>
</body>
</html>
